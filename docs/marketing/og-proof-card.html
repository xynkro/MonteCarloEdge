<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #0a0e13; --gold: #f5c451; --gold-2: #e0a52e; --emerald: #3fd6c4; --txt: #eef2f0;
    --mut: rgba(238,242,240,.62); --line: rgba(255,255,255,.10);
  }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(120% 95% at 50% -15%, #14241d 0%, var(--ink) 58%);
    color: var(--txt); position: relative;
    padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between;
  }
  body::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(60% 80% at 85% 20%, rgba(245,196,81,.10), transparent 70%);
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 22px; letter-spacing: .04em; color: var(--gold); }
  .brand .bolt { font-size: 28px; }
  .eyebrow { margin-top: 30px; font-size: 20px; letter-spacing: .28em; text-transform: uppercase; color: var(--mut); font-weight: 800; }
  h1 { font-size: 92px; font-weight: 800; line-height: .98; letter-spacing: -.02em; margin: 14px 0 0; }
  h1 .hl { color: var(--gold); }
  .sub { margin-top: 22px; font-size: 30px; font-weight: 600; color: var(--txt); }
  .sub b { color: var(--emerald); font-weight: 800; }
  .stats { display: flex; gap: 14px; margin-top: 30px; }
  .stat { background: rgba(255,255,255,.045); border: 1px solid var(--line); border-radius: 16px; padding: 16px 22px; }
  .stat .v { font-size: 30px; font-weight: 800; color: var(--emerald); font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 17px; color: var(--mut); margin-top: 2px; }
  .foot { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 22px; }
  .foot .seed { font-size: 22px; color: var(--mut); font-weight: 600; }
  .foot .seed b { color: var(--txt); }
  .foot .url { font-size: 22px; font-weight: 800; color: var(--gold); }
</style>
</head>
<body>
  <div>
    <div class="brand"><span class="bolt">⚡</span> MONTECARLO EDGE</div>
    <div class="eyebrow">The Backtest</div>
    <h1>Backtested over<br><span class="hl">1,000,000</span> hands</h1>
    <div class="sub">Blended <b>+117.75 bb/100</b> — wins <b>every</b> opponent style.</div>
    <div class="stats">
      <div class="stat"><div class="v">+201</div><div class="k">vs Stations</div></div>
      <div class="stat"><div class="v">+103</div><div class="k">vs Loose-aggressive</div></div>
      <div class="stat"><div class="v">+68</div><div class="k">vs Solid regs</div></div>
      <div class="stat"><div class="v">+52</div><div class="k">vs Nits</div></div>
    </div>
  </div>
  <div class="foot">
    <div class="seed"><b>Seeded &amp; reproducible</b> — run it yourself.</div>
    <div class="url">montecarloedge.web.app/proof</div>
  </div>
</body>
</html>
