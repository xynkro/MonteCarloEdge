  <!-- Analytics (privacy-light). Replace G-XXXXXXXXXX with your GA4 Measurement ID
       (GA4 → Admin → Data Streams → your web stream). It's a NO-OP until you do. -->
  <script>
    window.__MCE_GA__ = "G-XXXXXXXXXX";
    if (window.__MCE_GA__ && window.__MCE_GA__.indexOf("XXXX") === -1) {
      var s = document.createElement("script"); s.async = true;
      s.src = "https://www.googletagmanager.com/gtag/js?id=" + window.__MCE_GA__;
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag("js", new Date()); window.gtag("config", window.__MCE_GA__);
    }
  </script>
